<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SCMLite - Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <script src="https://www.google.com/recaptcha/api.js" async defer></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    /* === LOADING OVERLAY === */
    .loading-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(2px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 9999;
    }

    .loading-overlay.active {
      opacity: 1;
      pointer-events: all;
    }

    .loader {
      width: 55px;
      height: 55px;
      border: 5px solid #1e3a8a;
      border-top: 5px solid #3a8bff;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
      box-shadow: 0 0 15px rgba(58,139,255,0.8);
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* === BODY === */
    body {
      font-family: 'Poppins', sans-serif;
      background: #0d1117;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    /* === BACKGROUND SHAPES === */
    .curve1 {
      position: absolute;
      width: 900px;
      height: 900px;
      background: linear-gradient(45deg, #0d1117, #3a8bff);
      top: -250px;
      right: -250px;
      opacity: 0.42;
      filter: blur(12px);
      transform: rotate(22deg) skewY(33deg);
    }

    .curve2 {
      position: absolute;
      width: 1200px;
      height: 900px;
      background: #0d1117;
      border-top: 3px solid #3a8bff;
      bottom: -260px;
      left: -260px;
      opacity: 0.5;
      transform: rotate(-22deg) skewY(-33deg);
    }

    /* === LOGIN CARD === */
    .login-box {
      width: 430px;
      padding: 50px 40px;
      background: rgba(255,255,255,0.06);
      backdrop-filter: blur(12px);
      border-radius: 16px;
      border: 1px solid rgba(58,139,255,0.4);
      box-shadow: 0 0 25px rgba(58,139,255,0.5);
      z-index: 3;
      animation: cardFade 1s ease forwards;
    }

    @keyframes cardFade {
      from { opacity: 0; transform: translateY(40px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .login-box h2 {
      text-align: center;
      color: #fff;
      font-size: 30px;
      margin-bottom: 20px;
      letter-spacing: 1px;
      text-shadow: 0 0 10px rgba(58,139,255,0.7);
    }

    /* === GLASS INPUTS === */
    .input-group {
      position: relative;
      margin-bottom: 25px;
    }

    .input-group input {
      width: 100%;
      padding: 14px 12px;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 10px;
      color: white;
      font-size: 16px;
      outline: none;
      transition: 0.3s;
      box-shadow: inset 0 0 6px rgba(0,0,0,0.4);
    }

    .input-group input:focus {
      border: 1px solid #3a8bff;
      box-shadow:
        0 0 12px rgba(58,139,255,0.6),
        inset 0 0 6px rgba(58,139,255,0.3);
      background: rgba(255,255,255,0.12);
    }

    /* FLOAT LABEL */
    .input-group label {
      position: absolute;
      top: 50%;
      left: 10px;
      color: #9bbcff;
      transform: translateY(-50%);
      transition: 0.3s ease;
      pointer-events: none;
    }

    .input-group input:focus ~ label,
    .input-group input:not(:placeholder-shown) ~ label {
      top: -8px;
      color: #3a8bff;
      font-size: 13px;
    }

    /* === FLASH === */
    .flash {
      background: rgba(255, 60, 60, 0.2);
      border-left: 4px solid red;
      padding: 10px;
      color: #ff8c8c;
      margin-bottom: 10px;
      border-radius: 4px;
      text-align: center;
    }

    /* === BUTTON === */
    button {
      width: 100%;
      padding: 12px;
      background: transparent;
      color: white;
      border: 2px solid #3a8bff;
      border-radius: 40px;
      cursor: pointer;
      font-size: 17px;
      font-weight: 600;
      overflow: hidden;
      position: relative;
      z-index: 1;
      margin-top: 10px;
    }

    button::before {
      content: "";
      position: absolute;
      height: 300%;
      width: 100%;
      background: linear-gradient(#0d1117, #3a8bff, #0d1117);
      top: -100%;
      left: 0;
      transition: 0.5s;
      z-index: -1;
    }

    button:hover::before {
      top: 0;
    }

    /* LINKS */
    .links {
      text-align: center;
      margin-top: 18px;
    }

    .links a {
      color: #6aaeff;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
    }

    .links a:hover {
      text-decoration: underline;
    }

    .g-recaptcha {
      margin-top: 10px;
    }

    /* ===== Validation styles ===== */
    .form-error {
      color: #b00020;
      font-size: .9rem;
      margin-top: 6px;
      /* ensure it does not overlap label */
      display: block;
    }

    .input-error {
      border-color: #b00020 !important;
      box-shadow: 0 0 8px rgba(176,0,32,0.15) !important;
      background: rgba(255,255,255,0.06) !important;
    }

    /* optional: move floating label up a bit when input-error present */
    .input-error + label,
    .input-group .input-error ~ label {
      top: -8px;
      color: #b00020;
      font-size: 13px;
    }

  </style>
</head>

<body>

  <div class="curve1"></div>
  <div class="curve2"></div>

  <div class="login-box">
    <h2>SCMLite Login</h2>

    {% if flash %}
      <div class="flash">{{ flash }}</div>
    {% endif %}

   <form id="loginForm" action="/login" method="POST" onsubmit="return validateLoginForm(event)" novalidate>

  <div class="input-group">
    <input id="username" name="username" placeholder=" " required aria-describedby="username-error">
    <label for="username">Email Address</label>
  </div>

  <div class="input-group">
    <input type="password" id="password" name="password" placeholder=" " required aria-describedby="password-error">
    <label for="password">Password</label>
  </div>

  <div class="g-recaptcha" data-sitekey="{{ site_key }}"></div>

  <button type="submit">Login</button>
</form>

<div class="links">
  <a href="/forgot-password">Forgot Password?</a><br>
  <a href="javascript:void(0)" onclick="showLoaderAndGo('/signup')">Create an Account</a>
</div>

  </div>

  <script>
    function showLoaderAndGo(url) {
      const overlay = document.getElementById("loaderOverlay");
      overlay.classList.add("active");
      setTimeout(() => { window.location.href = url; }, 600);
    }
  </script>

  <script src="/static/js/validation.js"></script>

  <div id="loaderOverlay" class="loading-overlay" aria-hidden="true">
    <div class="loader" role="status" aria-label="Loading"></div>
  </div>

</body>
</html>
