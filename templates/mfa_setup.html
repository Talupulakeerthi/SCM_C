<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>MFA Setup | SCMLite</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    /* Root Colors */
    :root {
      --bg: #0d1117;
      --glass: rgba(255,255,255,0.06);
      --border: rgba(58,139,255,0.4);
      --accent: #3a8bff;
      --muted: #9bbcff;
      --text: #ffffff;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: "Poppins", sans-serif;
      background: var(--bg);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      color: var(--text);
    }

    /* Background Shapes */
    .curve1 {
      position: absolute;
      width: 1000px;
      height: 950px;
      background: linear-gradient(45deg, #0d1117, #3a8bff);
      top: -250px;
      right: -280px;
      opacity: 0.45;
      filter: blur(12px);
      transform: rotate(24deg) skewY(34deg);
    }
    .curve2 {
      position: absolute;
      width: 1200px;
      height: 900px;
      background: #0d1117;
      border-top: 3px solid #3a8bff;
      bottom: -260px;
      left: -260px;
      opacity: 0.6;
      transform: rotate(-22deg) skewY(-33deg);
    }

    /* Glass Card */
    .card {
      width: 420px;
      padding: 40px 35px;
      background: var(--glass);
      backdrop-filter: blur(12px);
      border-radius: 16px;
      border: 1px solid var(--border);
      box-shadow: 0 0 25px rgba(58,139,255,0.4);
      animation: fadeIn 0.8s ease forwards;
      text-align: center;
      position: relative;
      z-index: 5;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(40px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    h2 {
      font-size: 26px;
      margin-bottom: 10px;
      text-shadow: 0 0 10px rgba(58,139,255,0.7);
    }

    .desc {
      color: var(--muted);
      font-size: 15px;
      margin-bottom: 25px;
    }

    /* QR Code */
    .qr-box {
      display: flex;
      justify-content: center;
      margin-bottom: 25px;
    }
    .qr-box img {
      width: 200px;
      height: 200px;
      background: white;
      padding: 8px;
      border-radius: 10px;
    }

    /* 6-digit OTP Inputs */
    .otp-wrapper {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    .otp-input {
      width: 48px;
      height: 55px;
      font-size: 22px;
      text-align: center;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.08);
      color: white;
      outline: none;
      transition: 0.25s;
      backdrop-filter: blur(4px);
    }

    .otp-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 10px rgba(58,139,255,0.7);
      background: rgba(255,255,255,0.15);
    }

    /* Button */
    button {
      width: 100%;
      padding: 12px;
      background: transparent;
      border: 2px solid var(--accent);
      border-radius: 40px;
      color: white;
      cursor: pointer;
      font-size: 17px;
      font-weight: 600;
      overflow: hidden;
      position: relative;
      z-index: 1;
      margin-top: 10px;
    }

    button::before {
      content: "";
      position: absolute;
      height: 300%;
      width: 100%;
      background: linear-gradient(#0d1117, #3a8bff, #0d1117);
      top: -100%;
      left: 0;
      transition: 0.5s;
      z-index: -1;
    }

    button:hover::before {
      top: 0;
    }

    /* Back Link */
    .back {
      margin-top: 18px;
      font-size: 14px;
      color: #6aaeff;
      text-decoration: none;
      display: inline-block;
    }

    .back:hover {
      text-decoration: underline;
    }

  </style>
</head>

<body>

  <!-- Background shapes -->
  <div class="curve1"></div>
  <div class="curve2"></div>

  <!-- Main Card -->
  <div class="card">

    <h2>MFA Setup</h2>
    <p class="desc">Scan the QR code below using Google Authenticator or Microsoft Authenticator.</p>

    <div class="qr-box">
      <img src="{{ qr_url }}" alt="QR Code">
    </div>

    <p class="desc">Enter the 6-digit verification code:</p>

    <form action="/mfa/enable" method="post" id="mfaForm">
      <div class="otp-wrapper">
        <input class="otp-input" maxlength="1" name="d1" required>
        <input class="otp-input" maxlength="1" name="d2" required>
        <input class="otp-input" maxlength="1" name="d3" required>
        <input class="otp-input" maxlength="1" name="d4" required>
        <input class="otp-input" maxlength="1" name="d5" required>
        <input class="otp-input" maxlength="1" name="d6" required>
      </div>

      <input type="hidden" name="code" id="codeInput">

      <button type="submit">Verify & Enable</button>
    </form>

    <a href="/login" class="back">← Back to Login</a>

  </div>

  <script>
    /* Auto-focus OTP inputs & combine into hidden field */
    const inputs = document.querySelectorAll(".otp-input");
    const hidden = document.getElementById("codeInput");

    inputs.forEach((inp, i) => {
      inp.addEventListener("input", () => {
        if (inp.value.length === 1 && i < 5) inputs[i+1].focus();
        updateCode();
      });
      inp.addEventListener("keydown", e => {
        if (e.key === "Backspace" && i > 0 && !inp.value) inputs[i-1].focus();
      });
    });

    function updateCode() {
      hidden.value = Array.from(inputs).map(i => i.value).join("");
    }
  </script>

</body>
</html>
