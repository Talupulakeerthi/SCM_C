<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>MFA Setup | SCMLite</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    /* Root Colors */
    :root {
      --bg: #0d1117;
      --glass: rgba(255,255,255,0.06);
      --border: rgba(58,139,255,0.4);
      --accent: #3a8bff;
      --muted: #9bbcff;
      --text: #ffffff;
      --error: #ff5a6a;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: "Poppins", sans-serif;
      background: var(--bg);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      color: var(--text);
    }

    /* Background Shapes */
    .curve1 {
      position: absolute;
      width: 1000px;
      height: 950px;
      background: linear-gradient(45deg, #0d1117, #3a8bff);
      top: -250px;
      right: -280px;
      opacity: 0.45;
      filter: blur(12px);
      transform: rotate(24deg) skewY(34deg);
    }
    .curve2 {
      position: absolute;
      width: 1200px;
      height: 900px;
      background: #0d1117;
      border-top: 3px solid #3a8bff;
      bottom: -260px;
      left: -260px;
      opacity: 0.6;
      transform: rotate(-22deg) skewY(-33deg);
    }

    /* Glass Card */
    .card {
      width: 420px;
      padding: 40px 35px;
      background: var(--glass);
      backdrop-filter: blur(12px);
      border-radius: 16px;
      border: 1px solid var(--border);
      box-shadow: 0 0 25px rgba(58,139,255,0.4);
      animation: fadeIn 0.8s ease forwards;
      text-align: center;
      position: relative;
      z-index: 5;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(40px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    h2 {
      font-size: 26px;
      margin-bottom: 10px;
      text-shadow: 0 0 10px rgba(58,139,255,0.7);
    }

    .desc {
      color: var(--muted);
      font-size: 15px;
      margin-bottom: 25px;
    }

    /* QR Code */
    .qr-box {
      display: flex;
      justify-content: center;
      margin-bottom: 18px;
    }
    .qr-box img {
      width: 200px;
      height: 200px;
      background: white;
      padding: 8px;
      border-radius: 10px;
    }

    /* 6-digit OTP Inputs */
    .otp-wrapper {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .otp-input {
      width: 48px;
      height: 55px;
      font-size: 22px;
      text-align: center;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.08);
      color: white;
      outline: none;
      transition: 0.25s;
      backdrop-filter: blur(4px);
    }

    .otp-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 10px rgba(58,139,255,0.7);
      background: rgba(255,255,255,0.15);
    }

    /* Button */
    button {
      width: 100%;
      padding: 12px;
      background: transparent;
      border: 2px solid var(--accent);
      border-radius: 40px;
      color: white;
      cursor: pointer;
      font-size: 17px;
      font-weight: 600;
      overflow: hidden;
      position: relative;
      z-index: 1;
      margin-top: 10px;
    }

    button::before {
      content: "";
      position: absolute;
      height: 300%;
      width: 100%;
      background: linear-gradient(#0d1117, #3a8bff, #0d1117);
      top: -100%;
      left: 0;
      transition: 0.5s;
      z-index: -1;
    }

    button:hover::before {
      top: 0;
    }

    /* Back Link */
    .back {
      margin-top: 18px;
      font-size: 14px;
      color: #6aaeff;
      text-decoration: none;
      display: inline-block;
    }

    .back:hover {
      text-decoration: underline;
    }

    /* ================
       Validation styles
       ================ */

    .form-error {
      color: var(--error);
      font-size: 13px;
      margin-top: 8px;
      opacity: 0;
      transform: translateY(6px);
      transition: opacity .18s ease, transform .18s ease;
    }
    .form-error.show {
      opacity: 1;
      transform: translateY(0);
    }

    .input-error {
      border-color: var(--error) !important;
      box-shadow: 0 0 14px rgba(255,90,106,0.18) !important;
    }

    @keyframes shakeX {
      0%{ transform: translateX(0) }
      20%{ transform: translateX(-6px) }
      40%{ transform: translateX(6px) }
      60%{ transform: translateX(-4px) }
      80%{ transform: translateX(4px) }
      100%{ transform: translateX(0) }
    }
    .shake { animation: shakeX 420ms ease; }

  </style>
</head>

<body>

  <!-- Background shapes -->
  <div class="curve1"></div>
  <div class="curve2"></div>

  <!-- Main Card -->
  <div class="card">

    <h2>MFA Setup</h2>
    <p class="desc">Scan the QR code below using Google Authenticator or Microsoft Authenticator.</p>

    <div class="qr-box">
      <!-- Replace {{ qr_url }} with server-rendered QR in your template system -->
      <img src="{{ qr_url }}" alt="QR Code">
    </div>

    <p class="desc">Enter the 6-digit verification code:</p>

    <form action="/mfa/enable" method="post" id="mfaForm" novalidate>
      <div class="otp-wrapper" id="otpWrapper">
        <input class="otp-input" maxlength="1" name="d1" inputmode="numeric" pattern="\d*" autocomplete="one-time-code" required>
        <input class="otp-input" maxlength="1" name="d2" inputmode="numeric" pattern="\d*" autocomplete="one-time-code" required>
        <input class="otp-input" maxlength="1" name="d3" inputmode="numeric" pattern="\d*" autocomplete="one-time-code" required>
        <input class="otp-input" maxlength="1" name="d4" inputmode="numeric" pattern="\d*" autocomplete="one-time-code" required>
        <input class="otp-input" maxlength="1" name="d5" inputmode="numeric" pattern="\d*" autocomplete="one-time-code" required>
        <input class="otp-input" maxlength="1" name="d6" inputmode="numeric" pattern="\d*" autocomplete="one-time-code" required>
      </div>

      <div class="form-error" id="otpError" role="alert" aria-live="polite"></div>

      <input type="hidden" name="code" id="codeInput">

      <button type="submit">Verify & Enable</button>
    </form>

    <a href="/login" class="back">← Back to Login</a>

  </div>

  <!-- ===============================
       Validation + Console-logging
       =============================== -->
  <script>
    // Console message on load
    console.log("MFA Validation Loaded ✓");

    // Elements
    const inputs = Array.from(document.querySelectorAll(".otp-input"));
    const hidden = document.getElementById("codeInput");
    const form = document.getElementById("mfaForm");
    const otpError = document.getElementById("otpError");
    const otpWrapper = document.getElementById("otpWrapper");

    console.log("OTP fields detected:", inputs.length);

    // Helper: update hidden code and log
    function updateCode() {
      const code = inputs.map(i => i.value.trim()).join("");
      hidden.value = code;
      console.log("Current OTP:", code);
      return code;
    }

    // Error helpers
    function showOtpError(msg) {
      otpError.textContent = msg;
      otpError.classList.add("show");
      inputs.forEach(i => i.classList.add("input-error"));
    }
    function clearOtpError() {
      otpError.textContent = "";
      otpError.classList.remove("show");
      inputs.forEach(i => i.classList.remove("input-error"));
    }

    // Input handlers: digit-only, auto-advance, paste, key nav
    inputs.forEach((inp, i) => {
      inp.addEventListener("input", (e) => {
        const before = inp.value;
        const cleaned = inp.value.replace(/\D/g, "");
        if (cleaned !== inp.value) inp.value = cleaned;
        if (inp.value.length > 1) inp.value = inp.value.slice(-1);
        if (inp.value !== before) {
          console.log(`Input changed in box ${i+1}:`, inp.value);
        } else {
          console.log(`Input typed in box ${i+1}:`, inp.value);
        }

        updateCode();
        clearOtpError();

        if (inp.value && i < inputs.length - 1) {
          inputs[i+1].focus();
          console.log(`Focus moved → Box ${i+2}`);
        }
      });

      inp.addEventListener("keydown", (e) => {
        if (e.key === "Backspace" && !inp.value && i > 0) {
          inputs[i-1].focus();
          console.log(`Backspace → Moved back to Box ${i}`);
        }
        if (e.key === "ArrowLeft" && i > 0) {
          inputs[i-1].focus();
          console.log(`ArrowLeft → Box ${i}`);
        }
        if (e.key === "ArrowRight" && i < inputs.length-1) {
          inputs[i+1].focus();
          console.log(`ArrowRight → Box ${i+2}`);
        }
      });

      inp.addEventListener("paste", (e) => {
        e.preventDefault();
        const paste = (e.clipboardData || window.clipboardData).getData('text').replace(/\D/g, "");
        console.log("Paste detected:", paste);
        for (let k = 0; k < paste.length && (i + k) < inputs.length; k++) {
          inputs[i+k].value = paste[k];
        }
        updateCode();
        const nextIndex = Math.min(inputs.length - 1, i + paste.length);
        inputs[nextIndex].focus();
        console.log(`Paste populated up to box ${nextIndex+1}`);
      });
    });

    // Submit validation + logging
    form.addEventListener("submit", function (ev) {
      console.log("MFA Validation Triggered");
      const code = updateCode();

      if (code.length !== 6 || /\D/.test(code)) {
        ev.preventDefault();
        console.warn("❌ OTP Validation Failed — Incomplete or invalid code");
        showOtpError("Please enter the 6-digit verification code.");

        // focus / scroll to first empty
        const firstEmpty = inputs.find(i => !i.value) || inputs[0];
        try { firstEmpty.focus({preventScroll:false}); } catch(e) {}
        firstEmpty.scrollIntoView({ behavior: "smooth", block: "center" });

        // shake wrapper
        otpWrapper.classList.remove("shake");
        void otpWrapper.offsetWidth; // reflow
        otpWrapper.classList.add("shake");
        setTimeout(() => otpWrapper.classList.remove("shake"), 500);
        return false;
      }

      console.log("✔ OTP Validation Passed — Submitting Form...");
      clearOtpError();
      // allow form to submit normally
      return true;
    });

    // Clear displayed error when user types
    inputs.forEach(i => i.addEventListener("input", () => {
      if (otpError.classList.contains("show")) clearOtpError();
    }));
  </script>

</body>
</html>
