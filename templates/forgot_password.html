<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Forgot Password | SCMLite</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

  <!-- Feather Icons -->
  <script src="https://unpkg.com/feather-icons"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    /* ===== Loading Overlay ===== */
    .loading-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.65);
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(2px);
      opacity: 0;
      pointer-events: none;
      transition: 0.3s ease;
      z-index: 9999;
    }
    .loading-overlay.active { opacity: 1; pointer-events: all; }

    .loader {
      width: 55px;
      height: 55px;
      border: 5px solid #1e3a8a;
      border-top: 5px solid #3a8bff;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
      box-shadow: 0 0 15px rgba(58,139,255,0.8);
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    body {
      font-family: "Poppins", sans-serif;
      background: #0d1117;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    /* Background curves */
    .curve1 {
      position: absolute;
      width: 1000px; height: 950px;
      background: linear-gradient(45deg, #0d1117, #3a8bff);
      top: -250px; right: -280px;
      opacity: 0.45;
      filter: blur(12px);
      transform: rotate(24deg) skewY(34deg);
    }
    .curve2 {
      position: absolute;
      width: 1200px; height: 900px;
      background: #0d1117;
      border-top: 3px solid #3a8bff;
      bottom: -260px; left: -260px;
      opacity: 0.6;
      transform: rotate(-22deg) skewY(-33deg);
    }

    /* Card */
    .card-box {
      width: 430px;
      padding: 50px 40px;
      background: rgba(255,255,255,0.06);
      backdrop-filter: blur(12px);
      border-radius: 16px;
      border: 1px solid rgba(58,139,255,0.18);
      box-shadow: 0 0 25px rgba(0,0,0,0.35);
      z-index: 3;
      animation: fadeIn 1s ease forwards;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(40px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .card-box h2 {
      text-align: center;
      color: #fff;
      font-size: 28px;
      margin-bottom: 10px;
      text-shadow: 0 0 8px rgba(58,139,255,0.6);
    }

    .card-box p {
      text-align: center;
      color: #9bbcff;
      margin-bottom: 25px;
      font-size: 14px;
    }

    /* Flash */
    .flash {
      background: rgba(255,60,60,0.12);
      border-left: 3px solid rgba(255,80,80,0.4);
      color: #ffb6b6;
      padding: 12px;
      margin-bottom: 18px;
      border-radius: 6px;
      text-align: center;
      backdrop-filter: blur(6px);
    }

    /* Input Group */
    .input-group {
      position: relative;
      margin-bottom: 23px;
    }

    .input-group input {
      width: 100%;
      padding: 14px 42px 14px 14px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 10px;
      color: #fff;
      font-size: 16px;
      outline: none;
      transition: 0.3s;
      box-shadow: inset 0 0 4px rgba(0,0,0,0.45);
    }

    .input-group input:focus {
      border-color: #3a8bff;
      background: rgba(255,255,255,0.08);
      box-shadow:
        0 0 8px rgba(58,139,255,0.35),
        inset 0 0 4px rgba(58,139,255,0.25);
    }

    /* Floating Label */
    .input-group label {
      position: absolute;
      top: 50%;
      left: 14px;
      transform: translateY(-50%);
      color: #9bbcff;
      pointer-events: none;
      transition: 0.3s ease;
    }

    .input-group input:focus ~ label,
    .input-group input:not(:placeholder-shown) ~ label {
      top: -8px;
      font-size: 13px;
      color: #3a8bff;
    }

    /* Icon */
    .input-icon {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: #9bbcff;
      width: 18px;
      height: 18px;
    }

    /* Button */
    button {
      width: 100%;
      padding: 12px;
      background: transparent;
      border: 2px solid #3a8bff;
      border-radius: 40px;
      color: white;
      font-size: 17px;
      cursor: pointer;
      overflow: hidden;
      font-weight: 600;
      position: relative;
      z-index: 1;
    }

    button::before {
      content: "";
      position: absolute;
      width: 100%;
      height: 300%;
      top: -100%;
      left: 0;
      background: linear-gradient(#0d1117, #3a8bff, #0d1117);
      transition: 0.5s;
      z-index: -1;
    }

    button:hover::before { top: 0; }

    /* Links */
    .links {
      text-align: center;
      margin-top: 15px;
    }
    .links a {
      color: #6aaeff;
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>

<body>

  <div class="curve1"></div>
  <div class="curve2"></div>

  <div class="card-box">

    <h2>Forgot Password?</h2>
    <p>Enter your email to receive a password reset link.</p>

    {% if flash %}
      <div class="flash">{{ flash }}</div>
    {% endif %}

    <!-- FORM -->
    <form action="/forgot-password" method="POST" onsubmit="return validateForgotPasswordForm()">

      <div class="input-group">
        <input type="email" id="email" name="email" placeholder=" " required>
        <label>Email Address</label>
        <i data-feather="mail" class="input-icon"></i>
      </div>

      <button type="submit">Send Reset Link</button>
    </form>

    <div class="links">
      <a href="javascript:void(0)" onclick="showLoaderAndGo('/login')">← Back to Login</a>
    </div>

  </div>

  <script>
    function showLoaderAndGo(url) {
      const overlay = document.getElementById("loaderOverlay");
      overlay.classList.add("active");
      setTimeout(() => { window.location.href = url; }, 600);
    }
    feather.replace();
  </script>

  <script src="/static/js/validation.js"></script>

  <div id="loaderOverlay" class="loading-overlay">
    <div class="loader"></div>
  </div>

</body>
</html>
