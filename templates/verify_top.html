<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SCMLite - Verify MFA</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    :root {
      --accent: #3a8bff;
      --glass: rgba(255,255,255,0.06);
      --border: rgba(58,139,255,0.4);
      --muted: #9bbcff;
      --bg: #0d1117;
      --text: #ffffff;
      --error: #ff5a6a;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: "Poppins", sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    /* Background Shapes */
    .curve1 {
      position: absolute;
      width: 1000px;
      height: 950px;
      background: linear-gradient(45deg, #0d1117, #3a8bff);
      top: -250px;
      right: -280px;
      opacity: 0.45;
      filter: blur(12px);
      transform: rotate(24deg) skewY(34deg);
    }
    .curve2 {
      position: absolute;
      width: 1200px;
      height: 900px;
      background: #0d1117;
      border-top: 3px solid #3a8bff;
      bottom: -260px;
      left: -260px;
      opacity: 0.6;
      transform: rotate(-22deg) skewY(-33deg);
    }

    /* Card */
    .verify-box {
      width: 420px;
      padding: 40px 35px;
      background: var(--glass);
      backdrop-filter: blur(12px);
      border-radius: 16px;
      border: 1px solid var(--border);
      box-shadow: 0 0 25px rgba(58,139,255,0.4);
      animation: fadeIn 0.8s ease forwards;
      text-align: center;
      z-index: 10;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(40px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h2 {
      font-size: 28px;
      margin-bottom: 10px;
      text-shadow: 0 0 10px rgba(58,139,255,0.7);
    }

    .desc {
      font-size: 15px;
      color: var(--muted);
      margin-bottom: 25px;
    }

    /* Flash */
    .flash {
      background: rgba(255,60,60,0.25);
      border-left: 4px solid #ff4f4f;
      padding: 10px;
      color: #ffb3b3;
      margin-bottom: 15px;
      border-radius: 6px;
      text-align: center;
    }

    /* OTP Inputs */
    .otp-wrapper {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .otp-input {
      width: 48px;
      height: 55px;
      font-size: 22px;
      text-align: center;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.08);
      color: white;
      outline: none;
      transition: 0.25s;
      backdrop-filter: blur(4px);
    }

    .otp-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 10px rgba(58,139,255,0.7);
      background: rgba(255,255,255,0.15);
    }

    .input-error {
      border-color: var(--error) !important;
      box-shadow: 0 0 14px rgba(255,90,106,0.18) !important;
    }

    /* small inline error text */
    .otp-error {
      color: var(--error);
      font-size: 13px;
      margin-top: 8px;
      opacity: 0;
      transform: translateY(6px);
      transition: opacity .18s ease, transform .18s ease;
    }
    .otp-error.show {
      opacity: 1;
      transform: translateY(0);
    }

    /* shake */
    @keyframes shakeX {
      0%{ transform: translateX(0) }
      20%{ transform: translateX(-6px) }
      40%{ transform: translateX(6px) }
      60%{ transform: translateX(-4px) }
      80%{ transform: translateX(4px) }
      100%{ transform: translateX(0) }
    }
    .shake { animation: shakeX 420ms ease; }

    /* Button */
    button {
      width: 100%;
      padding: 12px;
      background: transparent;
      border: 2px solid var(--accent);
      border-radius: 40px;
      color: white;
      cursor: pointer;
      font-size: 17px;
      font-weight: 600;
      overflow: hidden;
      position: relative;
      z-index: 1;
      margin-top: 5px;
    }

    button::before {
      content: "";
      position: absolute;
      height: 300%;
      width: 100%;
      background: linear-gradient(#0d1117, #3a8bff, #0d1117);
      top: -100%;
      left: 0;
      transition: 0.5s;
      z-index: -1;
    }

    button:hover::before {
      top: 0;
    }

    /* Footer Hint */
    .hint {
      margin-top: 18px;
      font-size: 13px;
      color: var(--muted);
    }
  </style>
</head>

<body>

  <div class="curve1"></div>
  <div class="curve2"></div>

  <div class="verify-box">

    <h2>Verify MFA</h2>
    <p class="desc">Enter the 6-digit code from your Authenticator app.</p>

    <!-- server flash (if present) -->
    {% if flash %}
    <div class="flash">{{ flash }}</div>
    {% endif %}

    <form method="post" action="/mfa/relogin/verify" id="verifyForm" novalidate>

      <div class="otp-wrapper" id="otpWrapper">
        <input class="otp-input" maxlength="1" name="d1" inputmode="numeric" pattern="\d*" autocomplete="one-time-code" required>
        <input class="otp-input" maxlength="1" name="d2" inputmode="numeric" pattern="\d*" autocomplete="one-time-code" required>
        <input class="otp-input" maxlength="1" name="d3" inputmode="numeric" pattern="\d*" autocomplete="one-time-code" required>
        <input class="otp-input" maxlength="1" name="d4" inputmode="numeric" pattern="\d*" autocomplete="one-time-code" required>
        <input class="otp-input" maxlength="1" name="d5" inputmode="numeric" pattern="\d*" autocomplete="one-time-code" required>
        <input class="otp-input" maxlength="1" name="d6" inputmode="numeric" pattern="\d*" autocomplete="one-time-code" required>
      </div>

      <div class="otp-error" id="otpError" aria-live="polite">Please enter the 6-digit code.</div>

      <!-- Hidden field to combine OTP -->
      <input type="hidden" name="code" id="codeInput">

      <button type="submit">Verify</button>
    </form>

    <div class="hint">
      Lost access? Contact admin to reset MFA.
    </div>

  </div>

  <script>
    // --- Console / Validation engine startup ---
    console.log("MFA Validation Engine Loaded ✓");

    const form = document.getElementById('verifyForm');
    const otpWrapper = document.getElementById('otpWrapper');
    const inputs = Array.from(document.querySelectorAll('.otp-input'));
    const hidden = document.getElementById('codeInput');
    const otpError = document.getElementById('otpError');

    console.log("OTP fields detected:", inputs.length);

    // helpers
    function setError(msg) {
      otpError.textContent = msg || "Please enter the 6-digit code.";
      otpError.classList.add('show');
      inputs.forEach(i => i.classList.add('input-error'));
    }
    function clearError() {
      otpError.classList.remove('show');
      inputs.forEach(i => i.classList.remove('input-error'));
    }

    function updateHidden() {
      const code = inputs.map(i => i.value.trim()).join('');
      hidden.value = code;
      console.log("Current OTP:", code);
      return code;
    }

    // Input behaviors: digits-only, auto-advance, paste, arrow nav, backspace
    inputs.forEach((inp, idx) => {
      inp.addEventListener('input', (e) => {
        const before = inp.value;
        // allow only digits
        inp.value = inp.value.replace(/\D/g,'');
        if (inp.value.length > 1) inp.value = inp.value.slice(-1);

        console.log(`Box ${idx+1} input: "${inp.value}"`);

        updateHidden();
        clearError();

        if (inp.value && idx < inputs.length - 1) {
          inputs[idx+1].focus();
          console.log(`Focus moved → Box ${idx+2}`);
        }
      });

      inp.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && !inp.value && idx > 0) {
          inputs[idx-1].focus();
          console.log(`Backspace → moved to box ${idx}`);
        }
        if (e.key === 'ArrowLeft' && idx > 0) {
          inputs[idx-1].focus();
        }
        if (e.key === 'ArrowRight' && idx < inputs.length - 1) {
          inputs[idx+1].focus();
        }
      });

      inp.addEventListener('paste', (e) => {
        e.preventDefault();
        const paste = (e.clipboardData || window.clipboardData).getData('text').replace(/\D/g, '');
        console.log("Paste detected:", paste);
        for (let k = 0; k < paste.length && (idx + k) < inputs.length; k++) {
          inputs[idx + k].value = paste[k];
        }
        updateHidden();
        const nextIndex = Math.min(inputs.length - 1, idx + paste.length);
        inputs[nextIndex].focus();
        console.log(`Paste populated up to box ${nextIndex+1}`);
      });
    });

    // Submit handling & validation
    form.addEventListener('submit', (ev) => {
      console.log("MFA Validation Triggered");
      const code = updateHidden();

      // block if not exactly 6 digits
      if (code.length !== 6 || /\D/.test(code)) {
        ev.preventDefault();
        console.warn("❌ OTP Validation Failed — Incomplete or invalid code");
        setError("Please enter the 6-digit verification code.");

        // focus first empty
        const firstEmpty = inputs.find(i => !i.value) || inputs[0];
        try { firstEmpty.focus({preventScroll:false}); } catch(e){ }
        // scroll into view (if necessary)
        firstEmpty.scrollIntoView({ behavior: "smooth", block: "center" });

        // animate shake
        otpWrapper.classList.remove('shake');
        void otpWrapper.offsetWidth; // force reflow
        otpWrapper.classList.add('shake');
        setTimeout(() => otpWrapper.classList.remove('shake'), 500);
        return false;
      }

      // pass
      clearError();
      console.log("✔ OTP Validation Passed — submitting form.");
      // let form submit to server
      return true;
    });

    // clear error as user types
    inputs.forEach(i => i.addEventListener('input', () => {
      if (otpError.classList.contains('show')) clearError();
    }));
  </script>

</body>
</html>
