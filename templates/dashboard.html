<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
/* ================= GLOBAL RESET ================= */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  height: 100vh;
  font-family: "Segoe UI", sans-serif;
  overflow-x: hidden;
}

/* ================= BACKGROUND ================= */
body {
  background: radial-gradient(circle at 20% 30%, #1d2b64, #1e1e2f 60%, #0b1f3a);
  color: #e8f1ff;
}

/* MAIN WRAPPER (light glass layer) */
.dashboard-container {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  background: rgba(255,255,255,0.02);
  backdrop-filter: blur(10px);
  position: relative;
  overflow: hidden;
}

/* SOFT GLOW SPHERES (same feel as admin) */
.dashboard-container::before,
.dashboard-container::after {
  content: "";
  position: fixed;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(255,255,255,0.18), rgba(255,255,255,0));
  filter: blur(45px);
  opacity: 0.38;
  pointer-events: none;
  z-index: -1;
  animation: float 9s infinite alternate ease-in-out;
}

.dashboard-container::before {
  width: 320px;
  height: 320px;
  top: 110px;
  left: 120px;
}

.dashboard-container::after {
  width: 260px;
  height: 260px;
  bottom: 80px;
  right: 140px;
  opacity: 0.26;
  animation-duration: 13s;
}

@keyframes float {
  from { transform: translateY(0); }
  to   { transform: translateY(-40px); }
}

/* ================= TOP BAR ================= */
.topbar {
  background: rgba(22, 32, 60, 0.9);
  backdrop-filter: blur(18px);
  padding: 14px 36px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid rgba(255,255,255,0.06);
  position: sticky;
  top: 0;
  z-index: 10;
}

.brand {
  display: flex;
  align-items: center;
  gap: 0.6rem;
}

.brand i {
  font-size: 1.7rem;
  color: #b5ecff;
  filter: drop-shadow(0 0 8px rgba(140,230,255,0.9));
}

.brand h1 {
  font-size: 1.9rem;
  font-weight: 800;
  color: #e5f7ff;
  text-shadow: 0 0 12px rgba(140,230,255,0.9);
}

/* NAV MENU (matches admin screenshot) */
.nav-menu {
  display: flex;
  gap: 14px;
  flex-wrap: wrap;
}

.nav-menu a {
  text-decoration: none;
  padding: 10px 18px;
  background: rgba(34, 45, 78, 0.95);
  color: #ecf5ff;
  font-weight: 600;
  border-radius: 12px;
  border: 1px solid rgba(165,200,255,0.18);
  display: flex;
  align-items: center;
  gap: 0.4rem;
  box-shadow: 0 8px 16px rgba(0,0,0,0.45);
  transition: 0.25s ease;
}

.nav-menu a i {
  font-size: 0.95rem;
}

.nav-menu a:hover {
  background: rgba(70, 100, 160, 0.98);
  transform: translateY(-2px);
  box-shadow: 0 12px 24px rgba(0,0,0,0.6);
}

/* Logout same block style, just slightly warmer text */
.logout-btn {
  color: #ffe5bf !important;
}

/* ================= MAIN CONTENT ================= */
.main-content {
  flex: 1;
  padding: 70px 5vw 80px;
  text-align: center;
}

.main-content h2 {
  font-size: 2.8rem;
  font-weight: 800;
  color: #eaf7ff;
  text-shadow: 0 0 12px rgba(150,230,255,1);
  margin-bottom: 70px;
  opacity: 0;
  animation: fadeDown 0.7s ease forwards;
}

@keyframes fadeDown {
  from {
    opacity: 0;
    transform: translateY(-18px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* ================= PANELS (MATCH ADMIN CARDS) ================= */
.panel-container {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 70px;
}

/* square glass cards like admin */
.panel {
  width: 230px;
  height: 230px;
  background: rgba(34, 46, 82, 0.96);
  border-radius: 26px;
  border: 1px solid rgba(160,205,255,0.25);
  box-shadow:
    0 18px 40px rgba(0,0,0,0.65),
    0 0 22px rgba(100,180,255,0.25);
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  transition: 0.3s ease;
  cursor: pointer;
  opacity: 0;
  animation: fadeUp 0.7s ease forwards;
}

.left-panel { animation-delay: 0.15s; }
.right-panel { animation-delay: 0.3s; }

@keyframes fadeUp {
  from {
    opacity: 0;
    transform: translateY(25px) scale(0.96);
  }
  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

/* hover lift & glow like admin */
.panel:hover {
  transform: translateY(-12px);
  box-shadow:
    0 26px 60px rgba(0,0,0,0.75),
    0 0 30px rgba(130,210,255,0.45);
}

/* icon style */
.panel i {
  font-size: 2.6rem;
  margin-bottom: 1.1rem;
  color: #c6f3ff;
  filter: drop-shadow(0 0 10px rgba(150,230,255,0.95));
}

/* heading inside card */
.panel h3 {
  font-size: 1.1rem;
  font-weight: 600;
  margin-bottom: 1.2rem;
  color: #f3fbff;
}

/* BUTTONS – subtle, integrated (but keep onclick) */
.btn {
  padding: 0.45rem 1.6rem;
  font-size: 0.9rem;
  font-weight: 600;
  border-radius: 999px;
  border: 1px solid rgba(150,220,255,0.6);
  background: rgba(20, 120, 190, 0.95);
  color: #e8f9ff;
  cursor: pointer;
  box-shadow: 0 0 14px rgba(80,170,255,0.7);
  transition: 0.25s ease;
}

.btn:hover {
  background: rgba(90, 190, 255, 1);
  transform: translateY(-1px);
  box-shadow: 0 0 22px rgba(130,220,255,0.9);
}

/* Make the whole panel feel unified when hovered */
.panel:hover .btn {
  transform: translateY(-1px);
}

/* ================= RESPONSIVE ================= */
@media (max-width: 768px) {
  .topbar {
    flex-direction: column;
    align-items: flex-start;
    gap: 1rem;
  }

  .nav-menu {
    justify-content: flex-start;
  }

  .main-content {
    padding: 45px 6vw 60px;
  }

  .main-content h2 {
    font-size: 2.2rem;
    margin-bottom: 45px;
  }

  .panel-container {
    gap: 40px;
  }

  .panel {
    width: 210px;
    height: 210px;
  }
}
    </style>
</head>
<body>
<div class="dashboard-container">
    <!-- Top Navigation Bar -->
    <header class="topbar">
        <div class="brand">
            <i class="fa fa-cubes"></i>
            <h1>SCMLite</h1>
        </div>
        <nav class="nav-menu">
            <a href="/create-shipment"><i class="fa fa-plus"></i> New Shipment</a>
            <a href="/account"><i class="fa fa-user"></i> My Account</a>
            <a class="logout-btn" href="/logout"><i class="fa fa-sign-out-alt"></i> Log out</a>
        </nav>
    </header>
    <!-- Main Content -->
    <main class="main-content">
        <h2>Hello, Welcome to SCMxpertLite</h2>
        <div class="panel-container">
            <div class="panel left-panel">
                <i class="fa fa-truck"></i>
                <h3>Create a New Shipment</h3>
                <button class="btn" onclick="window.location.href='/create-shipment'">Create Shipment</button>
            </div>
            <div class="panel right-panel">
                <i class="fa fa-user"></i>
                <h3>My Account</h3>
                <button class="btn" onclick="window.location.href='/account'">Get your Account Details</button>
            </div>
        </div>
    </main>
</div>
</body>
</html>
