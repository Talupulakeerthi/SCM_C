<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SCMLite - Sign Up</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    /* === LOADING OVERLAY === */
    .loading-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(2px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 9999;
    }

    .loading-overlay.active { opacity: 1; pointer-events: all; }

    .loader {
      width: 55px;
      height: 55px;
      border: 5px solid #1e3a8a;
      border-top: 5px solid #3a8bff;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
      box-shadow: 0 0 15px rgba(58,139,255,0.8);
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    body {
      font-family: "Poppins", sans-serif;
      background: #0d1117;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    /* Background Shapes */
    .curve1 {
      position: absolute;
      width: 1000px;
      height: 950px;
      background: linear-gradient(45deg, #0d1117, #3a8bff);
      top: -250px;
      right: -280px;
      opacity: 0.45;
      filter: blur(12px);
      transform: rotate(24deg) skewY(34deg);
    }
    .curve2 {
      position: absolute;
      width: 1200px;
      height: 900px;
      background: #0d1117;
      border-top: 3px solid #3a8bff;
      bottom: -260px;
      left: -260px;
      opacity: 0.6;
      transform: rotate(-22deg) skewY(-33deg);
    }

    /* Signup Box */
    .signup-box {
      width: 460px;
      padding: 45px 40px;
      background: rgba(255,255,255,0.06);
      backdrop-filter: blur(12px);
      border-radius: 16px;
      border: 1px solid rgba(58,139,255,0.4);
      box-shadow: 0 0 25px rgba(58,139,255,0.5);
      z-index: 3;
    }

    .signup-box h2 {
      text-align: center;
      font-size: 32px;
      color: #ffffff;
      margin-bottom: 10px;
      text-shadow: 0 0 8px rgba(58,139,255,0.8);
    }

    .signup-box p { text-align: center; color: #9bbcff; margin-bottom: 25px; }

    /* === GLASS INPUTS === */
    .input-group { position: relative; margin-bottom: 25px; }

    .input-group input {
      width: 100%;
      padding: 14px 12px;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 10px;
      color: white;
      font-size: 16px;
      outline: none;
      transition: 0.3s;
      box-shadow: inset 0 0 6px rgba(0,0,0,0.4);
    }

    .input-group input:focus {
      border: 1px solid #3a8bff;
      box-shadow:
        0 0 12px rgba(58,139,255,0.6),
        inset 0 0 6px rgba(58,139,255,0.3);
      background: rgba(255,255,255,0.12);
    }

    /* Floating label */
    .input-group label {
      position: absolute;
      top: 50%;
      left: 10px;
      color: #9bbcff;
      transform: translateY(-50%);
      transition: 0.3s ease;
      pointer-events: none;
    }

    .input-group input:focus ~ label,
    .input-group input:not(:placeholder-shown) ~ label {
      top: -8px;
      color: #3a8bff;
      font-size: 13px;
    }

    /* Validation styles (works with validation.js) */
    .form-error { color: #b00020; font-size: .9rem; margin-top: 6px; display: block; }
    .input-error { border-color: #b00020 !important; box-shadow: 0 0 8px rgba(176,0,32,0.15) !important; background: rgba(255,255,255,0.06) !important; }
    .input-error + label, .input-group .input-error ~ label { top: -8px; color: #b00020; font-size: 13px; }

    /* Flash */
    .flash {
      background: rgba(255,60,60,0.25);
      border-left: 3px solid #ff4444;
      padding: 10px;
      color: #ffb3b3;
      margin-bottom: 15px;
      border-radius: 6px;
      text-align: center;
    }

    /* Button */
    button {
      width: 100%;
      padding: 12px;
      background: transparent;
      border: 2px solid #3a8bff;
      border-radius: 40px;
      font-size: 17px;
      color: white;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      font-weight: 600;
    }

    button::before {
      content: "";
      position: absolute;
      width: 100%;
      height: 300%;
      top: -100%;
      left: 0;
      background: linear-gradient(#0d1117, #3a8bff, #0d1117);
      transition: 0.5s;
      z-index: -1;
    }

    button:hover::before { top: 0; }

    small { display: block; margin-top: 12px; text-align: center; color: #9bbcff; font-size: 12px; }
    small a { color: #6aaeff; text-decoration: none; }

    .links { text-align: center; margin-top: 15px; }
    .links a { color: #6aaeff; font-weight: 600; text-decoration: none; }
  </style>
</head>

<body>

  <div class="curve1"></div>
  <div class="curve2"></div>

  <div class="signup-box">

    <h2>SCMLite</h2>
    <p>Create your account to get started</p>

    {% if flash %}
      <div class="flash">{{ flash }}</div>
    {% endif %}

    <!-- ===== FIXED FORM TAG ===== -->
    <form id="signupForm" action="/signup" method="POST" novalidate>

      <div class="input-group">
        <input type="text" id="fullname" name="fullname" placeholder=" " required aria-describedby="fullname-error">
        <label for="fullname">Full Name</label>
      </div>

      <div class="input-group">
        <input type="email" id="email" name="email" placeholder=" " required aria-describedby="email-error">
        <label for="email">Email Address</label>
      </div>

      <div class="input-group">
        <input type="password" id="password" name="password" placeholder=" " required aria-describedby="password-error">
        <label for="password">Password</label>
      </div>

      <div class="input-group">
        <input type="password" id="confirm_password" name="confirm_password" placeholder=" " required aria-describedby="confirm_password-error">
        <label for="confirm_password">Confirm Password</label>
      </div>

      <button type="submit">Sign Up</button>

      <small>I accept the <a href="#">Terms</a> and <a href="#">Privacy Policy</a></small>
    </form>

    <div class="links">
      <a href="javascript:void(0)" onclick="showLoaderAndGo('/login')">
        Already have an account? Login
      </a>
    </div>

  </div>

  <script>
    function showLoaderAndGo(url) {
      const overlay = document.getElementById("loaderOverlay");
      if (overlay) overlay.classList.add("active");
      setTimeout(() => { window.location.href = url; }, 600);
    }
  </script>

  <!-- your consolidated validation script (ensure path is correct) -->
  <script src="/static/js/validation.js"></script>

  <div id="loaderOverlay" class="loading-overlay" aria-hidden="true">
    <div class="loader" role="status" aria-label="Loading"></div>
  </div>

</body>
</html>
