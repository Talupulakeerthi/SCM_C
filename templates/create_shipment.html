<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Create Shipment | SCMLite</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    /* ---------------------------
       Base layout & visuals
       --------------------------- */
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family: 'Poppins', sans-serif; background:#0d1117; min-height:100vh; overflow-x:hidden; color:#dfefff; }

    .curve1,.curve2 { position:fixed; border-radius:50%; filter:blur(120px); opacity:0.35; z-index:0; }
    .curve1 { width:650px;height:650px;background:#3a8bff; top:-150px; left:-150px; }
    .curve2 { width:850px;height:850px;background:#0077ff; bottom:-200px; right:-200px; }

    .navbar { width:100%; padding:18px 40px; display:flex; justify-content:space-between; align-items:center; backdrop-filter: blur(12px); background: rgba(255,255,255,0.04); border-bottom:1px solid rgba(58,139,255,0.18); position:sticky; top:0; z-index:10; }
    .brand { font-size:22px; font-weight:700; color:#9ed1ff; display:flex; gap:12px; align-items:center; }
    .nav-links a { color:#9bbcff; text-decoration:none; margin-left:20px; font-weight:600; }

    .shipment-card { width:80%; max-width:1100px; margin:40px auto; background: rgba(255,255,255,0.04); border-radius:18px; padding:40px 45px; backdrop-filter: blur(18px); border: 1px solid rgba(58,139,255,0.16); box-shadow: 0 10px 40px rgba(12,40,70,0.6); position:relative; z-index:2; }
    .shipment-card h2{ text-align:center; font-size:32px; margin-bottom:6px; color:#fff; text-shadow:0 0 12px rgba(58,139,255,0.9); }
    .shipment-card p{ text-align:center; color:#9bbcff; margin-bottom:20px; }

    .form-row { display:flex; gap:25px; margin-bottom:18px; }
    .form-group { flex:1; display:flex; flex-direction:column; position:relative; }
    label { margin-bottom:8px; color:#9bbcff; font-weight:600; }
    input, select, textarea {
      padding:12px 14px; border-radius:12px; border:1px solid rgba(255,255,255,0.08); background: rgba(0,0,0,0.35); color:white; font-size:15px; outline:none;
      transition: box-shadow .18s ease, border-color .18s ease, transform .12s ease;
    }
    textarea { min-height:120px; resize:vertical; }

    /* ========================
       ERROR STYLING + ANIMATION
       ======================== */

    /* fade-in of message */
    .form-error {
      color: #ff9b9b;
      font-size:13px;
      margin-top:8px;
      opacity:0;
      transform: translateY(6px);
      transition: opacity .18s ease, transform .18s ease;
      pointer-events: none;
    }
    .form-error.show {
      opacity:1;
      transform: translateY(0);
      pointer-events: auto;
    }

    /* red glow for inputs when invalid */
    .input-error {
      border-color: #ff5a6a !important;
      box-shadow: 0 0 18px rgba(255,90,106,0.18) !important;
    }

    /* shake animation */
    @keyframes shakeX {
      0%{ transform: translateX(0) }
      20%{ transform: translateX(-6px) }
      40%{ transform: translateX(6px) }
      60%{ transform: translateX(-4px) }
      80%{ transform: translateX(4px) }
      100%{ transform: translateX(0) }
    }
    .shake { animation: shakeX 420ms ease; }

    .form-buttons { display:flex; justify-content:center; gap:22px; margin-top:24px; }
    .submit-btn, .clear-btn { padding:12px 32px; border-radius:40px; border:2px solid #3a8bff; background:transparent; color:white; font-weight:700; cursor:pointer; transition: all .18s ease; }
    .submit-btn:hover { background:#3a8bff; box-shadow:0 6px 18px rgba(58,139,255,0.12); }
    .clear-btn:hover { background:#ff4444; border-color:#ff4444; box-shadow:0 6px 18px rgba(255,68,68,0.12); }

    /* small responsive tweaks */
    @media (max-width:900px){
      .form-row{ flex-direction:column; }
    }
  </style>
</head>
<body>

  <div class="curve1"></div>
  <div class="curve2"></div>

  <div class="navbar">
    <div class="brand"><i class="fa fa-truck"></i> SCMLite</div>
    <div class="nav-links"><a href="/dashboard"><i class="fa fa-home"></i> Home</a><a href="/logout"><i class="fa fa-sign-out-alt"></i> Logout</a></div>
  </div>

  <div class="shipment-card">
    <h2>➕ Create New Shipment</h2>
    <p>Fill details below to create a shipment</p>

    <form id="shipmentForm" action="/create-shipment" method="POST" enctype="multipart/form-data" novalidate>

      <!-- ROW 1 -->
      <div class="form-row">
        <div class="form-group">
          <label>Shipment Number</label>
          <input id="shipment_id" name="shipment_id" required>
        </div>
        <div class="form-group">
          <label>PO Number</label>
          <input id="po_number" name="po_number" required>
        </div>
      </div>

      <!-- ROW 2 -->
      <div class="form-row">
        <div class="form-group">
          <label>Route Details</label>
          <select id="route_details" name="route_details" required>
            <option value="">Select Route</option>
            <option>Delhi - Mumbai</option>
            <option>Hyderabad - Bangalore</option>
            <option>Chennai - Pune</option>
          </select>
        </div>

        <div class="form-group">
          <label>Device</label>
          <select id="device" name="device" required>
            <option value="">Select Device</option>
            <option>Sensor 1</option>
            <option>Sensor 2</option>
          </select>
        </div>
      </div>

      <!-- ROW 3 -->
      <div class="form-row">
        <div class="form-group">
          <label>NDC Number</label>
          <input id="ndc_number" name="ndc_number" required>
        </div>
        <div class="form-group">
          <label>Serial Number</label>
          <input id="serial_number" name="serial_number" required>
        </div>
      </div>

      <!-- ROW 4 -->
      <div class="form-row">
        <div class="form-group">
          <label>Container Number</label>
          <input id="container_number" name="container_number" required>
        </div>

        <div class="form-group">
          <label>Goods Type</label>
          <select id="goods_type" name="goods_type" required>
            <option value="">Select</option>
            <option>Pharma</option>
            <option>Food</option>
          </select>
        </div>
      </div>

      <!-- ROW 5 -->
      <div class="form-row">
        <div class="form-group">
          <label>Expected Delivery Date</label>
          <input type="date" id="expected_delivery_date" name="expected_delivery_date" required>
        </div>
        <div class="form-group">
          <label>Delivery Number</label>
          <input id="delivery_number" name="delivery_number" required>
        </div>
      </div>

      <!-- ROW 6 -->
      <div class="form-row">
        <div class="form-group">
          <label>Batch ID</label>
          <input id="batch_id" name="batch_id" required>
        </div>
        <div class="form-group">
          <label>Origin</label>
          <input id="origin" name="origin" required>
        </div>
      </div>

      <!-- ROW 7 -->
      <div class="form-row">
        <div class="form-group">
          <label>Destination</label>
          <input id="destination" name="destination" required>
        </div>
        <div class="form-group">
          <label>Status</label>
          <select id="status" name="status" required>
            <option value="">Select Status</option>
            <option>Created</option>
            <option>In Transit</option>
            <option>Delivered</option>
          </select>
        </div>
      </div>

      <!-- ROW 8 -->
      <div class="form-group">
        <label>Shipment Description</label>
        <textarea id="shipment_description" name="shipment_description" required></textarea>
      </div>

      <div class="form-buttons">
        <button class="submit-btn" type="submit"><i class="fa fa-check"></i> Create Shipment</button>
        <button class="clear-btn" type="reset"><i class="fa fa-eraser"></i> Clear</button>
      </div>

    </form>
  </div>

  <!-- ===============================
       Validation engine (embedded)
       =============================== -->
  <script>
  /* ---------- Helpers ---------- */
  function $(id) { return document.getElementById(id); }
  function isEmpty(el) { return !el || el.value.trim() === ""; }
  function isValidEmail(email) { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email); }
  function isValidDate(str) { const d = new Date(str); return !isNaN(d.getTime()); }

  function showError(el, message) {
    if (!el) return;
    clearError(el);
    const container = el.parentElement;
    const err = document.createElement("div");
    err.className = "form-error";
    err.innerText = message;
    container.appendChild(err);
    // mark input
    el.classList.add("input-error");
    // small timeout to allow CSS transition then show
    requestAnimationFrame(() => err.classList.add("show"));
  }

  function clearError(el) {
    if (!el) return;
    el.classList.remove("input-error");
    const err = el.parentElement.querySelector(".form-error");
    if (err) err.remove();
  }

  function disableSubmit(form) { const btn = form.querySelector("button[type=submit]"); if (btn) btn.disabled = true; }
  function enableSubmit(form) { const btn = form.querySelector("button[type=submit]"); if (btn) btn.disabled = false; }

  function runValidators(validators, form, event) {
    let ok = true;
    validators.forEach(v => {
      clearError(v.el);
      if (!v.fn()) {
        ok = false;
        showError(v.el, v.msg);
      }
    });
    if (!ok) {
      event.preventDefault();
      enableSubmit(form);
    } else {
      disableSubmit(form);
    }
    return ok;
  }

  /* ---------- FORM VALIDATORS ---------- */
  function validateShipment(ev) {
    const form = ev.target;
    const fields = [
      { id: "shipment_id", len: 3 },
      { id: "po_number", len: 1 },
      { id: "route_details", len: 1 },
      { id: "device", len: 1 },
      { id: "ndc_number", len: 1 },
      { id: "serial_number", len: 1 },
      { id: "container_number", len: 1 },
      { id: "goods_type", len: 1 },
      { id: "expected_delivery_date", date: true },
      { id: "delivery_number", len: 1 },
      { id: "batch_id", len: 1 },
      { id: "origin", len: 1 },
      { id: "destination", len: 1 },
      { id: "status", len: 1 },
      { id: "shipment_description", len: 10 }
    ];

    const validators = fields.map(f => {
      const el = $(f.id);
      return {
        el,
        fn: () => {
          if (!el) return false;
          if (f.date) return isValidDate(el.value);
          return el.value.trim().length >= (f.len || 1);
        },
        msg: `${(f.id || '').replace(/_/g,' ')} is required.`
      };
    });

    return runValidators(validators, form, ev);
  }

  /* ---------- Attach validators on DOM ready ---------- */
  document.addEventListener("DOMContentLoaded", () => {
    const attach = (selector, fn) => {
      const f = document.querySelector(selector);
      if (f) f.addEventListener("submit", fn);
    };
    attach("#shipmentForm", validateShipment);
    console.log("Validation engine loaded ✔");
  });

  /* ---------- UX helper: focus/scroll/shake first invalid field ---------- */
  document.addEventListener("DOMContentLoaded", () => {
    const form = document.getElementById("shipmentForm");
    if (!form) return;
    form.addEventListener("submit", () => {
      // allow validation.js to attach error nodes first
      setTimeout(() => {
        // find first input with .input-error OR first .form-error
        let firstInvalid = form.querySelector(".input-error");
        if (!firstInvalid) {
          const msg = form.querySelector(".form-error");
          if (msg) {
            const parent = msg.parentElement;
            firstInvalid = parent && parent.querySelector("input, select, textarea");
          }
        }
        if (firstInvalid) {
          try { firstInvalid.focus({preventScroll:false}); } catch(e) {}
          firstInvalid.scrollIntoView({ behavior: "smooth", block: "center" });
          const grp = firstInvalid.closest(".form-group") || firstInvalid.parentElement;
          if (grp) {
            grp.classList.remove("shake");
            void grp.offsetWidth; // reflow
            grp.classList.add("shake");
            setTimeout(()=> grp.classList.remove("shake"), 500);
            const err = grp.querySelector(".form-error");
            if (err) err.classList.add("show");
          }
        }
      }, 40);
    });

    // When user types, remove the error for that input smoothly
    form.addEventListener("input", (e) => {
      const el = e.target;
      if (!el) return;
      const err = el.parentElement && el.parentElement.querySelector(".form-error");
      if (err) err.classList.remove("show");
    }, true);
  });
  </script>

</body>
</html>
